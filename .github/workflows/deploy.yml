# --- File: .github/workflows/deploy.yml ---
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # ตรวจสอบให้แน่ใจว่า Branch หลักของคุณชื่อ main (ถ้าชื่อ master ให้แก้ตรงนี้ด้วย)

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20  # ✅ อัปเกรดเป็นรุ่น 20 แล้วครับ (Rocket Upgrade!)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build